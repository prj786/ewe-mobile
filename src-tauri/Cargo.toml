[package]
name = "ewe-mobile"
version = "0.2.2-beta"
description = "ewe Mobile — your phone on your desktop: messages, contacts, notifications, media and files"
authors = ["scubba"]
license = "MIT"
edition = "2021"

[lib]
name = "ewe_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Open through the portal, so ewe's file picker draws it (ewe RFC-011); the
# default "gtk3" feature drew GTK's dialog inside this app instead
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"   # pictures as data: URLs (contact photos, album art, app icons)
# The phone link: every call to kdeconnectd goes over the session bus. The
# same zbus (and its default async-io backend) tauri-plugin-single-instance
# already brings, so nothing new is compiled for it.
zbus = "5"
# the web view's leave event (pointer.rs); the gtk that Tauri itself uses
gtk = "0.18"

# ewe Mobile is a window over KDE Connect's daemon: it owns no connection to
# the phone, no pairing keys and no state of its own. Everything it does is a
# D-Bus call the user could make with kdeconnect-cli. No privileged helper,
# no shell strings.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
