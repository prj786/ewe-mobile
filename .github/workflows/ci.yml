name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri links the webkit/gtk stack even to type-check. Linux build
      # dependencies only — the app itself targets Arch.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev build-essential file \
            dbus-daemon python3-dbus python3-gi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend
        run: |
          npm ci
          npm test
          npm run build

      # `tauri build` (the release, makepkg) refuses npm packages and Rust
      # crates on different major.minor — this job never runs it, so a
      # floating `^` on @tauri-apps/* passes here and fails the package
      # build (ewe Sync v0.15.0-beta, 2026-10-31). Same rule, checked early.
      - name: Tauri npm and Rust versions agree
        run: |
          python3 - <<'PY'
          import json, re
          npm = json.load(open("package-lock.json"))["packages"]
          cargo = open("src-tauri/Cargo.lock").read()
          def crate(name):
              m = re.search(r'name = "%s"\nversion = "([^"]+)"' % re.escape(name), cargo)
              return m.group(1) if m else None
          pairs = {"api": "tauri"}
          for k in npm:
              if k.startswith("node_modules/@tauri-apps/plugin-"):
                  pairs[k.rsplit("/", 1)[1]] = "tauri-" + k.rsplit("/", 1)[1]
          bad = []
          for js, rs in pairs.items():
              jv = npm.get("node_modules/@tauri-apps/" + js, {}).get("version")
              rv = crate(rs)
              print(f"@tauri-apps/{js} {jv}  ·  {rs} {rv}")
              if jv and rv and jv.split(".")[:2] != rv.split(".")[:2]:
                  bad.append(f"@tauri-apps/{js} {jv} vs {rs} {rv}")
          assert not bad, "major.minor differ (tauri build refuses this): " + "; ".join(bad)
          PY

      # the two `live_*` tests need a phone and stay ignored here
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # a stand-in daemon and an impostor on a throwaway session bus: the
      # app must believe only the first (skips itself without dbus/python)
      - name: Only the daemon's signals pass
        run: tests/origin.sh

      # the same throwaway bus, a stand-in phone: what the Remote page sends
      # must arrive with the signatures kdeconnectd declares
      - name: The daemon understands the Remote page
        run: tests/remote.sh

      # the same bus, a stand-in phone serving the C1 apps fixture, a fake
      # adb and scrcpy on PATH: the list, the cache, the launcher entries,
      # the triggers and the commandsChanged event (the binary half is
      # skipped here — no release build in CI)
      - name: The phone's apps, end to end
        run: tests/apps.sh

      - name: Shell syntax
        run: |
          bash -n PKGBUILD
          bash -n tests/smoke.sh
          bash -n tests/origin.sh
          bash -n tests/remote.sh
          bash -n tests/apps.sh
          bash -n tests/fakebin/adb
          bash -n tests/fakebin/scrcpy
          bash -n scripts/gen-icons.sh
